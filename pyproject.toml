[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldrag"
dynamic = ["version"]
description = "Structure-preserving document ingestion and cited retrieval that runs fully offline: no external APIs, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul Kaura" }]
dependencies = []
keywords = ["rag", "retrieval", "document-ai", "air-gapped", "bm25", "tables"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
fieldrag = "fieldrag.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fieldrag.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
